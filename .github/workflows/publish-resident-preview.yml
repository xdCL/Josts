name: Publish resident preview

on:
  push:
    branches: [ "feature/v1.3-resident" ]
    paths:
      - ".github/workflows/publish-resident-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC x86
        shell: pwsh
        run: cmake -S . -B build -A Win32 -DJOSTS_REQUIRE_X86=ON -DJOSTS_BUILD_TESTS=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "build/Release/Josts.exe" "release/Josts-v1.3.0-resident-preview.exe"
          @("
          Josts v1.3.0 Resident Preview
          
          PILOTO: no es una versión estable.
          
          - Servicio residente de bajo consumo.
          - Revisión periódica de la batería firmada.
          - UAC requerido para detener/desinstalar desde Josts.
          - Preserva entradas externas del archivo hosts.
          
          Repositorio: https://github.com/xdCL/Josts
          ") | Set-Content -Encoding utf8 "release/LEEME.txt"
          $hash=(Get-FileHash "release/Josts-v1.3.0-resident-preview.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Josts-v1.3.0-resident-preview.exe" | Set-Content -Encoding ascii "release/SHA256.txt"
          Compress-Archive -Path "release/Josts-v1.3.0-resident-preview.exe","release/LEEME.txt","release/SHA256.txt" -DestinationPath "release/Josts-v1.3.0-resident-preview-portable.zip" -Force

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.3.0-resident-preview" `
            "release/Josts-v1.3.0-resident-preview.exe#Josts Resident Preview EXE" `
            "release/Josts-v1.3.0-resident-preview-portable.zip#Josts Resident Preview ZIP portable" `
            "release/SHA256.txt#SHA-256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Josts v1.3.0 Resident Preview · piloto" `
            --notes "Piloto público de Josts Resident. Servicio de Windows de bajo consumo para mantener sincronizada la batería firmada. No es una versión estable. Úsalo primero en un solo equipo de prueba." `
            --prerelease
