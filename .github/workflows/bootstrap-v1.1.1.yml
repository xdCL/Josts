name: Bootstrap Josts v1.1.1 source

on:
  push:
    branches:
      - dev/v1.1.1
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-v1.1.1.yml'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/v1.1.1

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part* > /tmp/josts-source.b64
          base64 --decode /tmp/josts-source.b64 > /tmp/josts-source.zip
          mkdir -p /tmp/josts-source
          unzip -q /tmp/josts-source.zip -d /tmp/josts-source
          rsync -a --delete-excluded --exclude='.git/' --exclude='bootstrap/' /tmp/josts-source/ ./
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-v1.1.1.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que importar."
            exit 0
          fi
          git commit -m "feat: import Josts v1.1.1 source"
          git push origin HEAD:dev/v1.1.1
